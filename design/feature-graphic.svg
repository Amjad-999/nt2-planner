<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F9488"/>
      <stop offset="0.55" stop-color="#0B7268"/>
      <stop offset="1" stop-color="#084F48"/>
    </linearGradient>
    <radialGradient id="oGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F58F20" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F58F20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16B0A2"/>
      <stop offset="1" stop-color="#0A6E64"/>
    </linearGradient>
    <linearGradient id="fbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E9F6F4"/>
    </linearGradient>
    <linearGradient id="forb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBA53C"/>
      <stop offset="1" stop-color="#EE7F14"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="500" fill="url(#fbg)"/>
  <circle cx="880" cy="470" r="360" fill="url(#oGlow)"/>

  <!-- faint oversized bars motif on the right -->
  <g opacity="0.06" fill="#ffffff">
    <rect x="726" y="250" width="70" height="150" rx="20"/>
    <rect x="820" y="180" width="70" height="220" rx="20"/>
    <rect x="914" y="96"  width="70" height="304" rx="20"/>
  </g>

  <!-- ── App icon tile ── -->
  <g transform="translate(80,150)">
    <rect width="200" height="200" rx="48" fill="url(#tile)"/>
    <g transform="scale(0.390625)">
      <circle cx="322" cy="150" r="70" fill="#F58F20" opacity="0.35"/>
      <rect x="164" y="280" width="52" height="82"  rx="17" fill="url(#fbar)" opacity="0.9"/>
      <rect x="230" y="232" width="52" height="130" rx="17" fill="url(#fbar)" opacity="0.95"/>
      <rect x="296" y="176" width="52" height="186" rx="17" fill="url(#fbar)"/>
      <rect x="150" y="372" width="212" height="16" rx="8" fill="#ffffff" opacity="0.95"/>
      <circle cx="322" cy="150" r="28" fill="url(#forb)"/>
      <circle cx="313" cy="141" r="8" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>

  <!-- ── Wordmark ── -->
  <text x="320" y="238" font-family="'Segoe UI','Arial',sans-serif" font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-1">NT2</text>
  <circle cx="470" cy="212" r="9" fill="#F9A23F"/>
  <text x="492" y="238" font-family="'Segoe UI','Arial',sans-serif" font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-1">Planner</text>

  <!-- ── Arabic tagline (left-start so the RTL run stays on canvas) ── -->
  <text x="320" y="306" font-family="'Segoe UI','Tahoma','Arial',sans-serif" font-size="34" font-weight="600" fill="#E8F7F4">خطتك الذكية لاجتياز امتحان NT2</text>

  <!-- ── English subline ── -->
  <text x="322" y="358" font-family="'Segoe UI','Arial',sans-serif" font-size="26" font-weight="500" fill="#9FD8D1" letter-spacing="0.5">Vocabulary · Grammar · Mock exams · Reach B1</text>
</svg>
