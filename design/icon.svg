<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16B0A2"/>
      <stop offset="1" stop-color="#0A6E64"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.28" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E9F6F4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBB040" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FBB040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBA53C"/>
      <stop offset="1" stop-color="#EE7F14"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (safe for maskable cropping) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#hi)"/>

  <!-- soft goal glow behind the orb -->
  <circle cx="322" cy="150" r="76" fill="url(#glow)"/>

  <!-- ascending progress bars (kept within the central safe zone) -->
  <rect x="164" y="280" width="52" height="82"  rx="17" fill="url(#bar)" opacity="0.9"/>
  <rect x="230" y="232" width="52" height="130" rx="17" fill="url(#bar)" opacity="0.95"/>
  <rect x="296" y="176" width="52" height="186" rx="17" fill="url(#bar)"/>

  <!-- baseline -->
  <rect x="150" y="372" width="212" height="16" rx="8" fill="#ffffff" opacity="0.95"/>

  <!-- goal orb = Dutch orange -->
  <circle cx="322" cy="150" r="28" fill="url(#orb)"/>
  <circle cx="313" cy="141" r="8" fill="#ffffff" opacity="0.5"/>
</svg>
